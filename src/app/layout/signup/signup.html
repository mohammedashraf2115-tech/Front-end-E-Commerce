<div class="luxury-auth-wrapper py-5">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-6 col-lg-5">
        <div class="luxury-card p-4 p-md-5">
          
          <div class="text-center mb-4">
            <div class="luxury-brand-title fs-3 mb-1">L'ATELIER</div>
            <div class="luxury-caption">Create Client Profile</div>
            <p class="text-muted small mt-2 mb-0">Join our clientele for expedited checkout, order archives, and exclusive editions.</p>
          </div>

          @if(errorMessage){
            <div class="alert alert-danger py-2 px-3 small mb-4 d-flex align-items-center gap-2">
              <i class="fa-solid fa-triangle-exclamation"></i>
              <span>{{ errorMessage }}</span>
            </div>
          }

          <form [formGroup]="signupForm" (ngSubmit)="onSubmit()">
            <div class="mb-3">
              <label class="luxury-caption mb-1 d-block">Full Name</label>
              <input type="text" class="form-control-luxury w-100" formControlName="name" placeholder="e.g. Ahmed Hassan">
            </div>

            <div class="mb-3">
              <label class="luxury-caption mb-1 d-block">Email Address</label>
              <input type="email" class="form-control-luxury w-100" formControlName="email" placeholder="name@domain.com">
            </div>

            <div class="mb-4">
              <label class="luxury-caption mb-1 d-block">Password</label>
              <input type="password" class="form-control-luxury w-100" formControlName="password" placeholder="At least 6 characters">
            </div>

            <button type="submit" class="btn-luxury-dark w-100 py-3" [disabled]="loading || signupForm.invalid">
              @if(loading){
                <span class="spinner-border spinner-border-sm me-2"></span> Registering Client...
              } @else {
                Create Atelier Account
              }
            </button>
          </form>

          <div class="text-center mt-4 pt-3 border-top">
            <span class="small text-muted">Already registered with us? </span>
            <a routerLink="/login" class="small fw-bold text-dark text-decoration-none">
              Sign In &rarr;
            </a>
          </div>

        </div>
      </div>
    </div>
  </div>
</div>
